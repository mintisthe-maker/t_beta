@keyframes pdWinGlow{0%,100%{text-shadow:0 0 40px rgba(250,199,117,.3)}50%{text-shadow:0 0 80px rgba(250,199,117,.6),0 0 120px rgba(250,199,117,.2)}}

@keyframes pdFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.push-timer{position:fixed;left:0;right:0;bottom:0;z-index:55;display:none;align-items:center;gap:10px;padding:6px 16px;background:rgba(10,8,18,.94);border-top:1px solid rgba(201,162,39,.4)}

</style>
</head>
<body>
<div class="stage">
  <div class="content" id="content">
    <div class="idle" id="idle">
      <div class="sig">TORRENTATH</div>
      <div class="rule"></div>
      <div class="sub">The chronicle awaits</div>
    </div>
  </div>
  <div class="race-ticker" id="race-ticker"><div class="tk" id="race-ticker-track"></div></div>
  <div class="push-timer" id="push-timer"><span class="pt-count" id="pt-count"></span><div class="pt-track"><div class="pt-fill" id="pt-fill"></div></div><span class="pt-note">the broadcast returns</span></div>
  <div class="story-strip" id="story-strip" aria-live="polite">
    <div class="ss-img" id="ss-img"></div>
    <div class="ss-text"><div class="ss-title" id="ss-title"></div><div class="ss-flavor" id="ss-flavor"></div></div>
    <div class="ss-bar"><div class="ss-fill" id="ss-fill" style="width:100%"></div><div class="ss-time" id="ss-time"></div></div>
  </div>
  <div class="datebar hidden" id="datebar">
    <div class="d" id="d-text"></div>
    <div class="w" id="d-week"></div>
    <div class="pips" id="d-pips"></div>
    <div><span class="fest hidden" id="d-fest"></span></div>
    <div class="dbtimer hidden" id="db-timer"><div class="dbt-track"><div class="dbt-fill" id="db-fill"></div></div><span class="dbt-count" id="db-count"></span></div>
  </div>
</div>
<script>
'use strict';
const PD_SHAPES = { 'torrentath_datebar': 1 };
const PD_EXEMPT = {
  'torrentath_pd_mute': 'a device preference holding one character; not campaign state',
  'torrentath_msg': 'a cross-tab message bus, written and read within milliseconds',
  'torrentath_quarantine': 'the shared quarantine ledger itself (BL-053); a shape check here would quarantine the quarantine'
};
const PD_BUILD = 'v283';
function pdGet(k){
  let raw; try { raw = localStorage.getItem(k); } catch(e){ return null; }
  if (raw === null || raw === undefined) return null;
  const want = PD_SHAPES[k];
  if (want === undefined) return raw;
  let box = null; try { box = JSON.parse(raw); } catch(e){}
  const ok = box && typeof box === 'object' && !Array.isArray(box) && box.__s === want;
  if (!ok){ pdQuarantine(k, raw, (box && box.__b) || 'unstamped'); return null; }
  return JSON.stringify(box.d);
}
function pdSet(k, s){
  const want = PD_SHAPES[k];
  try {
    if (want === undefined){ localStorage.setItem(k, s); return; }
    localStorage.setItem(k, JSON.stringify({__s: want, __b: PD_BUILD, d: JSON.parse(s)}));
  } catch(e){}
}
function pdQuarantine(k, raw, from){
  try {
    let led = null; try { led = JSON.parse(localStorage.getItem('torrentath_quarantine') || 'null'); } catch(e){}
    if (!led || typeof led !== 'object' || !Array.isArray(led.pieces)) led = {v: 1, seq: 0, pieces: [], collapsed: []};
    led.seq = (led.seq || 0) + 1;
    led.pieces.push({id: led.seq, key: k, raw: raw, from: from, when: Date.now()});
    localStorage.setItem('torrentath_quarantine', JSON.stringify(led));
    localStorage.removeItem(k);
  } catch(e){}
}
const CH_NAME = 'torrentath_campaign';
const chan = ('BroadcastChannel' in window) ? new BroadcastChannel(CH_NAME) : null;
const content = document.getElementById('content');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function hello(){ if (chan) chan.postMessage({type:'display-hello', ts: Date.now()}); }
hello(); setInterval(hello, 5000);

var LICENCE_NOTICES = [
  'This work includes material taken from the System Reference Document 5.1 ("SRD 5.1") by Wizards of the Coast LLC and available at https://dnd.wizards.com/resources/systems-reference-document. The SRD 5.1 is licensed under the Creative Commons Attribution 4.0 International License available at https://creativecommons.org/licenses/by/4.0/legalcode.'
];
var LICENCE_HTML = '<div class="lic">' + LICENCE_NOTICES.map(function(t){
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}).join('<br>') + '</div>';
var STAMP_HTML = '<div class="pdstamp">Build v283 · 2026-08-17 — quote this line if you report a problem</div>';
var IDLE_HTML = '<div class="idle"><div class="sig">TORRENTATH</div><div class="rule"></div><div class="sub">The chronicle awaits</div>' + LICENCE_HTML + STAMP_HTML + '</div>';

function show(html){
  content.innerHTML = `<div class="fade">${html}</div>`;
}
function fitBody(){
  const body = content.querySelector('.doc .body');
  if (body){
    let fs = parseFloat(getComputedStyle(body).fontSize);
    let guard = 40;
    while (body.scrollHeight > body.clientHeight + 2 && fs > 13 && guard--){
      fs -= 1;
      body.style.fontSize = fs + 'px';
    }
  }
}
function splitInline(pa){
  let t = pa.replace(/\s*(\[BEAT\s*\d+[^\]]*\])\s*/g, '\n$1 ');
  const re = /(^|\s)(\((\d{1,2})\)|(\d{1,2})[.)])\s+/g;
  const hits = [];
  let mm;
  while ((mm = re.exec(t))){
    hits.push({idx: mm.index + mm[1].length, n: +(mm[3] || mm[4])});
  }
  const run = [];
  for (const h of hits){
    if (!run.length){ if (h.n === 1) run.push(h); }
    else if (h.n === run[run.length - 1].n + 1) run.push(h);
  }
  if (run.length >= 2){
    let out = '', prev = 0;
    for (const h of run){ out += t.slice(prev, h.idx) + '\n'; prev = h.idx; }
    out += t.slice(prev);
    t = out;
  }
  return t.split('\n').map(l => l.trim()).filter(Boolean);
}
function liHTML(line){
  let mk = '', rest = line;
  const m = line.match(/^(\((\d{1,2})\)|(\d{1,2})[.)]|[✕◐•·\-–])\s+(.*)$/s);
  if (m){ mk = m[1]; rest = m[4]; }
  let lead = '';
  const lm = rest.match(/^(\[BEAT\s*\d+[^\]]*\])\s*(.*)$/s) || null;
  if (lm){ lead = `<span class="beattag">${esc(lm[1])}</span> `; rest = lm[2]; }
  else {
    const cm = rest.match(/^([A-Z][A-Z0-9' &-]{2,42}?)\s*(?:[-—:])\s+(.*)$/s);
    if (cm && cm[1] === cm[1].toUpperCase()){ lead = `<span class="lead">${esc(cm[1])}</span> — `; rest = cm[2]; }
  }
  return `<div class="li">${mk ? `<span class="mk">${esc(mk)}</span> ` : ''}${lead}${esc(rest)}</div>`;
}
function renderRich(text){
  const t = String(text || '').trim();
  const paras = t.split(/\n{2,}/);
  const LIST = /^\s*([✕◐•·\-–]|\(\d{1,2}\)|\d+[.)])\s+/;
  let anyList = false;
  const html = paras.map(pa => {
    const lines = splitInline(pa);
    const listy = lines.length > 1 && lines.filter(l => LIST.test(l) || /^\[BEAT/.test(l)).length >= Math.max(2, lines.length - 1);
    if (listy){ anyList = true; return lines.map(liHTML).join(''); }
    return `<p>${lines.map(esc).join('<br>')}</p>`;
  }).join('');
  const n = t.length;
  const sz = n < 160 ? 'sz1' : n < 520 ? 'sz2' : n < 1200 ? 'sz3' : 'sz4';
  const center = (n < 160 && !LIST.test(t)) ? ' center' : '';
  const drop = (sz !== 'sz1' && !anyList && !LIST.test(paras[0] || '')) ? ' dropcap' : '';
  const wide = anyList ? ' listy' : '';
  return {html, cls: sz + center + drop + wide};
}
function handle(m){
  if (!m || !m.type) return;
  if (m.type === 'story'){ showStory(m.payload || {}); return; }
  if (m.type === 'story_clear'){ hideStory(); return; }
  if (m.showFor) ptStart(m.showFor);
  else if (m.type !== 'date') ptHide();
  if (m.type !== 'race' && m.type !== 'date') pdTickerHide();
  if (m.type === 'signal'){
    const p = m.payload || {};
    const cfg = {
      x:      {bg: '#3a1010', line: '#8a2f21', big: '✕',  head: 'X-CARD',   sub: 'We skip this. No questions needed.'},
      red:    {bg: '#4a1512', line: '#a53b3b', big: '●',  head: 'RED',      sub: 'Stop. Scene paused — we adjust.'},
      yellow: {bg: '#3d3210', line: '#c9a227', big: '●',  head: 'YELLOW',   sub: 'Caution. Easing off and redirecting.'},
      green:  {bg: '#12351d', line: '#4a8f5c', big: '●',  head: 'GREEN',    sub: 'All clear. Carry on.'},
      pause:  {bg: '#241b3d', line: '#7b5ab0', big: '❚❚', head: 'PAUSE',    sub: 'Out of character for a minute. Everyone breathe.'}
    }[p.level] || {bg: '#222', line: '#888', big: '·', head: '—', sub: ''};
    document.body.style.background = cfg.bg;
    show(`<div style="text-align:center">
      <div style="font-size:clamp(70px,14vw,180px);color:${cfg.line};line-height:1">${cfg.big}</div>
      <div style="font-family:var(--ui);font-size:clamp(26px,4.5vw,60px);letter-spacing:.3em;color:var(--parchment);margin-top:8px">${cfg.head}</div>
      <div class="rule" style="background:linear-gradient(90deg,transparent,${cfg.line},transparent)"></div>
      <div style="font-size:clamp(18px,2.4vw,30px);color:var(--parchment)">${esc(cfg.sub)}</div>
    </div>`);
    return;
  }
  if (m.type !== 'signal') document.body.style.background = '';
  if (m.type === 'clear'){
    show(IDLE_HTML);
    return;
  }
  if (m.type === 'handout'){
    const p = m.payload || {};
    const r = renderRich(p.text);
    show(`<div class="doc ${r.cls}">${p.title ? `<h1>${esc(p.title)}</h1><div class="rule"></div>` : ''}<div class="body">${r.html}</div></div>`);
    fitBody();
  }
  if (m.type === 'vignette'){
    const p = m.payload || {};
    const r = renderRich(p.text);
    const img = p.image ? `<div style="text-align:center;margin-bottom:16px"><img src="${esc(resolveImageSrc(p.image))}" alt="${esc(p.title || 'Vignette')}" style="max-height:32vh;max-width:60vw;border:1px solid #4a4128;border-radius:4px;box-shadow:0 8px 40px rgba(0,0,0,.55)"></div>` : '';
    show(`<div class="doc ${r.cls}" style="max-width:min(90vw,64ch)">
      ${p.title ? `<h1>${esc(p.title)}</h1><div class="rule"></div>` : ''}
      ${img}
      <div class="body" style="${p.image ? 'max-height:44vh' : ''}">${r.html}</div>
    </div>`);
    fitBody();
  }
  if (m.type === 'transition'){
    const p = m.payload || {};
    show(`<div style="max-width:84vw;text-align:center">
      <div class="rule"></div>
      <div style="font-style:italic;font-size:clamp(24px,3.6vw,50px);line-height:1.55;color:var(--parchment)">${esc(p.text)}</div>
      <div class="rule"></div>
    </div>`);
  }
  if (m.type === 'initiative'){
    const p = m.payload || {};
    const rows = (p.entries || []).map(e => {
      const enemy = e.kind === 'grp';
      const box = e.active ? 'background:linear-gradient(90deg,rgba(224,182,74,.22),rgba(224,182,74,.03));border-left:4px solid var(--gold)' : 'border-left:4px solid rgba(255,255,255,.06)';
      const col = e.active ? 'var(--gold)' : 'var(--parchment)';
      return `<div style="display:flex;align-items:center;gap:14px;padding:9px 18px;border-radius:6px;margin-top:6px;${e.sub ? 'margin-left:clamp(18px,3vw,46px);opacity:.92;' : ''}${box}">
        <span style="width:1.4ch;text-align:center;color:var(--gold);font-size:clamp(18px,2.2vw,32px)">${e.active ? '▸' : (e.sub ? '<span style="color:rgba(255,255,255,.22)">↳</span>' : '')}</span>
        <span style="width:2.4ch;text-align:right;font-weight:700;font-size:clamp(20px,2.6vw,38px);color:${col}">${e.init == null ? '—' : e.init}</span>
        <span style="flex:1;font-size:${e.sub ? 'clamp(16px,1.9vw,27px)' : 'clamp(19px,2.4vw,34px)'};color:${col}">${esc(e.name)}${enemy ? ` <span style="font-size:.58em;letter-spacing:.12em;color:#d98079">✦ ENEMIES${e.count ? ' ×' + e.count : ''}</span>` : ''}${e.tag ? ` <span style="font-size:.58em;letter-spacing:.12em;color:${e.tagKind === 'walk' ? '#9fc08b' : (e.tagKind === 'mixed' ? '#8d8776' : '#a08bc0')}">${esc(String(e.tag).toUpperCase())}</span>` : ''}</span>
      </div>`;
    }).join('');
    show(`<div style="width:min(92vw,54ch)">
      <div style="text-align:center;font-family:var(--ui);letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-size:clamp(14px,1.8vw,22px)">Initiative</div>
      <div style="text-align:center;font-family:var(--ui);letter-spacing:.18em;color:#8d8776;font-size:clamp(11px,1.3vw,15px);margin-top:3px">${p.subtitle ? esc(p.subtitle) : 'Round ' + (p.round || 1)}</div>
      <div class="rule"></div>
      ${p.enemyActing ? `<div style="text-align:center;font-style:italic;color:#d98079;font-size:clamp(18px,2.2vw,30px);margin:10px 0 4px">An enemy takes its turn…</div>` : ''}
      ${rows || '<div style="text-align:center;color:#8d8776;margin-top:10px">Awaiting the order of battle…</div>'}
    </div>`);
    return;
  }
  if (m.type === 'pit'){
    const p = m.payload || {};
    if (p.kind === 'chalk'){
      const rows = (p.entrants || []).map(c => {
        const last = c.last === 'w' ? '<span class="w">won last</span>' : c.last === 'l' ? '<span class="l">lost last</span>' : '—';
        return `<div class="chrow"><span>${esc(c.name)} <span class="chip">Tier ${['','I','II','III','IV'][c.tier] || '?'}</span></span>
          <span class="rec">${c.w}–${c.l} · ${last}</span></div>`;
      }).join('');
      show(`<div class="pit"><div class="kick">The chalk · the entrants' board</div>
        <h1 style="font-size:clamp(30px,4.6vw,60px);color:var(--gold);margin-top:8px">THE CHALK</h1>
        <div class="rule"></div>
        <div style="max-width:720px;margin:0 auto;text-align:left">${rows || '<div class="kick" style="margin-top:10px">nobody on the chalk yet</div>'}</div>
        <div class="kick" style="margin-top:16px">the chip travels — honored at every pit</div></div>`);
      return;
    }
    if (p.kind === 'pitch'){
      const beats = (p.beats || []).map(b => `<div class="beat"><div class="bh">${esc(b.head)}</div><div class="bt2">${esc(b.text)}</div></div>`).join('');
      const board = (p.board || []).filter(r => (r.lines || []).length).map(r =>
        `<div class="obrow"><span class="obt">${esc(r.tier)} chip</span><span class="obl">${r.lines.map(x => `vs ${esc(x.vs)} — <b>${esc(x.you)}</b>`).join(' · ')}</span></div>`).join('');
      const champ = p.champ ? `<div class="kick" style="margin-top:14px;color:var(--gold)">👑 top of the chalk — ${esc(p.champ.name)} · ${esc(p.champ.tier)}</div>` : '';
      show(`<div class="pit">
        <div class="kick">${esc(p.venue || 'the pit')} · the boss explains the game</div>
        <h1 style="font-size:clamp(26px,4vw,52px);color:var(--gold);margin-top:8px">THE PITCH</h1>
        <div class="rule"></div>
        <div class="beats">${beats}</div>
        ${board ? `<div class="oboard"><div class="obh">THE ODDS BOARD — your line, by your chip, against your tier and up</div>${board}
          <div class="obn">a win shortens your line · a loss lengthens it · the book remembers</div></div>` : ''}
        ${champ}
        ${p.outro ? `<div class="call" style="margin-top:16px">“${esc(p.outro)}”<span class="who">— ${esc(p.boss || 'the pit boss')}</span></div>` : ''}
      </div>`);
      return;
    }
    const tierName = t => ['','Tier I','Tier II','Tier III','Tier IV'][t] || '';
    const ftr = (f, isWin) => `<div class="ftr${isWin ? ' win' : ''}">
      <div class="nm">${esc(f.name)}</div>
      <div class="meta">${f.tier ? `<span class="chip">${tierName(f.tier)}</span>` : (f.chalk ? '<span class="chip">the chalk</span>' : '')}${f.top ? '<span class="chip">👑 top of the chalk</span>' : ''}<span class="odds">${esc(f.odds || '')}</span></div>
    </div>`;
    const aWin = p.settled && p.winner === (p.fa || {}).name;
    const bWin = p.settled && p.winner === (p.fb || {}).name;
    let status, method = '';
    if (p.settled){
      status = `<div class="status result">${esc(String(p.winner).toUpperCase())} WINS</div>`;
      method = `<div class="method">${p.koRound ? `knockout · round ${p.koRound}` : p.decidedRound ? `by decision · round ${p.decidedRound}` : 'as called at the rope'}</div>`;
    }
    else if (p.sudden) status = '<div class="status sudden">SUDDEN DEATH</div>';
    else status = p.betsOpen ? '<div class="status open">BETS OPEN</div>' : '<div class="status closed">BETS CLOSED</div>';
